name: Flutter Nightly Build

on:
  # Fork note: the nightly cron is disabled on this mirror so it does not spend
  # Actions minutes unattended. workflow_dispatch stays available.
  # schedule:
  #   # schedule build every night
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
